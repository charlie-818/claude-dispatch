name: Bug Report
description: Report a bug
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the bug
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS version
      placeholder: "e.g., 14.6.1"
    validations:
      required: true
  - type: input
    id: iterm2_version
    attributes:
      label: iTerm2 version
      placeholder: "e.g., 3.4.x"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g., 3.11.0"
    validations:
      required: true
  - type: dropdown
    id: agent_type
    attributes:
      label: Agent type
      options:
        - Claude
        - Codex
        - Grok
    validations:
      required: true
  - type: textarea
    id: server_out
    attributes:
      label: Relevant lines from server.out (with secrets redacted)
      description: Paste relevant error messages or logs from server.out
      render: text
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I confirmed no secrets/tokens are in this report
          required: true
