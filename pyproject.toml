# Tool config and project metadata.
# Installation is via requirements.txt (flat module app, not a library).

[project]
name = "cc-dispatch"
version = "0.1.0"
description = "Phone control for a fleet of live agent panes (Claude Code, Codex, Grok) running in iTerm2"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "CC Dispatch contributors"}]
dependencies = [
    "aiohttp==3.14.3",
    "iterm2==2.22",
    "cryptography==50.0.1",
    "webauthn==3.0.0",
    "pywebpush==2.4.0",
    "pillow==12.3.0",
    "qrcode==8.2",
]

[project.urls]
Homepage = "https://charlie-818.github.io/claude-dispatch/"
Repository = "https://github.com/charlie-818/claude-dispatch"
Issues = "https://github.com/charlie-818/claude-dispatch/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E402", "E731", "E401", "E701", "E702", "E741", "B008", "B904"]  # E701/E702/E741: the codebase favours terse one-liners
exclude = ["prototype", "probe*.py", ".venv", "static", "site", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
